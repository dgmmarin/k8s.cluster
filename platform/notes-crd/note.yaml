# Owned by the notes project (github.com/dgmmarin/notes). The platform installs it
# because project apps may not create cluster-scoped resources.
# The Custom Resource Definition. After this is applied, `Note` becomes a
# first-class object type in the cluster — you can `kubectl get notes`,
# and the API server stores them in etcd like any built-in resource.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: notes.demo.example.com
spec:
  group: demo.example.com
  scope: Namespaced
  names:
    plural: notes
    singular: note
    kind: Note
    shortNames:
      - nt
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["title"]
              properties:
                title:
                  type: string
                  description: Short title of the note
                content:
                  type: string
                  description: Body text of the note
      # Extra columns shown by `kubectl get notes`.
      additionalPrinterColumns:
        - name: Title
          type: string
          jsonPath: .spec.title
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
